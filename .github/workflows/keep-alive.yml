# Keeps the free Supabase project from pausing after 7 days without activity.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_KEY (the public key).
# Note: GitHub switches off scheduled workflows after 60 days without repo activity.
name: keep-alive
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/start_info" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
